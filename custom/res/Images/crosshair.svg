<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve"
     viewBox="0 0 288 36">

    <style>
        .outline {
            fill: none;
            stroke: #000000;   /* 黑色边缘 */
            stroke-width: 7;
            stroke-linecap: round;
            stroke-miterlimit: 10;
        }

        .main {
            fill: none;
            stroke: #ffffff;   /* 白色线条 */
            stroke-width: 4;
            stroke-linecap: round;
            stroke-miterlimit: 10;
        }
    </style>

    <!-- 水平线：先画黑色轮廓 -->
    <path d="M0 18h72M288 18h-72" class="outline"/>
    <!-- 水平线：再画白色主体 -->
    <path d="M0 18h72M288 18h-72" class="main"/>

    <!-- V 形线：黑色轮廓 -->
    <path d="M194.5 31.1 144 18 93.5 31.1" class="outline"/>
    <!-- V 形线：白色主体 -->
    <path d="M194.5 31.1 144 18 93.5 31.1" class="main"/>

</svg>
